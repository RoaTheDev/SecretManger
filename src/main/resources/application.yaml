spring:
  application:
    name: SecretManager_ADITI_FINAL

  profiles:
    active: local

  jpa:
    hibernate:
      ddl-auto: validate            # schema.sql handles structure, hibernate just validates
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: UTC

  cache:
    type: caffeine

springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true

scalar:
  enabled: true
  url: http://localhost:8080/v3/api-docs
  path: /docs
  dark-mode: on
  authentication:
    type: bearer
    token: your-default-token-here
  theme: deep_space

management:
  endpoints:
    web:
      exposure:
        include: health, info, beans